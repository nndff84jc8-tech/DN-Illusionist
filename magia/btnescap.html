<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=EB+Garamond:ital,wght@0,500;1,400&display=swap" rel="stylesheet">

<style>


/* VAR */

:root{

    --black:#0a0908;
    --panel:#121110;

    --ink:#e9e4d8;
    --ink-dim:#8f8a7d;

    --red:#D9534F;
    --red-bright:#ff4d4d;

}


/* RESET */

*{

    margin:0;
    padding:0;

    box-sizing:border-box;

}


html{

    scroll-behavior:smooth;

}


body{

    background:var(--black);

    color:var(--ink);

    font-family:'EB Garamond',serif;

    overflow-x:hidden;

}


/* HEADER */

header{

    position:absolute;

    top:0;
    left:0;
    right:0;

    z-index:100;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:15px 6vw;

    background:rgba(0,0,0,.55);

    backdrop-filter:blur(8px);

    border-bottom:1px solid rgba(255,255,255,.08);

}


.brandmark{

    display:flex;

    align-items:center;

    text-decoration:none;

}


.brandmark img{

    display:block;

    object-fit:contain;

    transition:
        transform .4s ease,
        filter .4s ease;

}


.brandmark:hover img{

    transform:scale(1.05);

    filter:
        drop-shadow(0 0 6px rgba(217,83,79,.9))
        drop-shadow(0 0 14px rgba(217,83,79,.7))
        drop-shadow(0 0 26px rgba(217,83,79,.4));

}
  
.video{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px; /* spazio tra un video e l'altro */
	padding-top: 150px;
}

.video iframe{
    width: 800px;
    height: 450px;
    border-radius: 10px;
    box-shadow:
        0 0 60px rgba(217,83,79,.35),
        0 0 120px rgba(217,83,79,.18);
}
 /* ---------- FOOTER ---------- */
  footer{
    border-top:1px solid rgba(173,138,86,0.25);
    padding:40px 6vw 50px;
    display:flex;
    flex-wrap:wrap;
    gap:20px;
    align-items:center;
    justify-content:space-between;
	background: #000000;
  }

  footer .foot-name{
    font-family:'Cinzel', serif;
    font-size:13px;
    letter-spacing:0.18em;
    color:var(--ink-dim);
  }

  footer .socials{
    display:flex;
    gap:22px;
  }

  footer a{
    color:var(--ink-dim);
    text-decoration:none;
    font-size:14px;
    letter-spacing:0.05em;
    transition:color .3s ease;
  }
footer a:hover{
  color:var(--red-bright);
}

  /* BTN TORNA SU */

.back-top{

    position:fixed;

    right:25px;
    bottom:35px;

    width:45px;
    height:45px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#111;

    border:2px solid #d9534f;

    border-radius:12px;

    text-decoration:none;

    box-shadow:
    0 0 10px rgba(217,83,79,0.8),
    0 0 25px rgba(217,83,79,0.5);

    transition:.3s ease;

    z-index:999;

}

<!--freccia-->

.back-top span{

    width:14px;
    height:14px;

    border-left:5px solid #d9534f;
    border-top:5px solid #d9534f;

    transform:rotate(45deg);

    margin-top:8px;

    filter:
    drop-shadow(0 0 6px #d9534f);

}


/* effetto hover */

.back-top:hover{

    background:#d9534f;

    transform:translateY(-8px);

    box-shadow:
    0 0 20px rgba(217,83,79,1),
    0 0 45px rgba(217,83,79,.8);

}


.back-top:hover span{

    border-color:white;

    filter:
    drop-shadow(0 0 8px white);

}
<!--NAVBAR-->

header{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:15px 6vw;
  background:rgba(0,0,0,.65);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(255,255,255,.08);
  transition:
    background-color .4s ease,
    box-shadow .4s ease;
}

header.scrolled{
  background:#000 !important;
  box-shadow:
    0 4px 20px rgba(0,0,0,.45);
}

.brandmark{
  display:flex;
  align-items:center;
  text-align:center;
  gap:10px;
  font-family:'Cinzel',serif;
  font-size:15px;
  letter-spacing:.14em;
  color:var(--ink);
  text-decoration:none;
}

.brandmark img{
  object-fit:contain;
  mix-blend-mode:lighten;
  transition:
    transform .4s ease,
    filter .4s ease;
}

.brandmark:hover img{
  transform:scale(1.05);
  filter:
    drop-shadow(0 0 6px rgba(217,83,79,.9))
    drop-shadow(0 0 14px rgba(217,83,79,.7))
    drop-shadow(0 0 26px rgba(217,83,79,.4));
}

nav.links{
  display:flex;
  align-items:center;
  gap:32px;
}

nav.links a{
  position:relative;
  display:inline-block;
  color:#D9534F;
  text-shadow:
    0 0 10px rgba(217,83,79,.8);
  font-family:'Cinzel',serif;
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
  padding:10px 0;
  text-decoration:none;
}

nav.links a::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:2px;
  width:0;
  height:1px;
  background:#D9534F;
  transform:translateX(-50%);
  transition:width .4s ease;
}

nav.links a::before{
  content:"✦";
  position:absolute;
  left:50%;
  bottom:-17px;
  font-size:12px;
  color:#D9534F;
  text-shadow:
    0 0 10px rgba(217,83,79,.8);
  opacity:0;
  transform:
    translateX(-50%)
    translateY(4px);
  transition:
    opacity .35s ease,
    transform .35s ease;
}

nav.links a:hover::after{
  width:100%;
}

nav.links a:hover::before{
  opacity:1;
  transform:
    translateX(-50%)
    translateY(0);
}

.nav-toggle{
  display:none;
}

nav.links .nav-coming{
  color:#D9534F;
  text-shadow:
    0 0 10px rgba(217,83,79,.8);
  font-family:'Cinzel',serif;
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
  padding:10px 0;
  text-decoration:none;
}
/* =========================
   RIAPRI COOKIE
   (stessa struttura di .back-top: stessa
   grandezza, colore ed effetto hover)
========================= */

.cookie-reopen{
  position:fixed;
  right:25px;
  bottom:90px;
  width:45px;
  height:45px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#111;
  border:2px solid #d9534f;
  border-radius:12px;
  text-decoration:none;
  font-size:20px;
  line-height:1;
  cursor:pointer;
  box-shadow:
    0 0 10px rgba(217,83,79,.8),
    0 0 25px rgba(217,83,79,.5);
  transition:.3s ease;
  z-index:999;
}

.cookie-reopen:hover{
  background:#d9534f;
  transform:translateY(-8px);
  box-shadow:
    0 0 20px rgba(217,83,79,1),
    0 0 45px rgba(217,83,79,.8);
}
<!--COOKIE BANNER-->

#cookie-banner{
  position:fixed;
  right:25px;
  bottom:25px;
  width:360px;
  max-width:calc(100vw - 40px);
  background:#0a0908;
  border:1px solid #D9534F;
  border-radius:12px;
  padding:20px;
  display:flex;
  align-items:flex-start;
  gap:14px;
  box-shadow:
    0 10px 40px rgba(0,0,0,.8),
    0 0 20px rgba(217,83,79,.25);
  font-family:'EB Garamond',serif;
  opacity:1;
  transform:translateY(0);
  transition:
    opacity .4s ease,
    transform .4s ease;
  /* SOPRA ASSOLUTAMENTE TUTTO */
  z-index:2147483647;
}

<!-- ICONA COOKIE-->

.cookie-icon{
  font-size:28px;
  line-height:1;
  flex-shrink:0;
}

/* CONTENUTO */

.cookie-content{
  flex:1;
}

.cookie-title{
  color:#D9534F;
  font-family:'Cinzel',serif;
  font-size:13px;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:7px;
}

.cookie-text{
  color:#e9e4d8;
  font-size:15px;
  line-height:1.4;
}

<!--BTN-->

.cookie-buttons{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:15px;
}

.cookie-buttons button{
  padding:8px 15px;
  border:1px solid #D9534F;
  background:transparent;
  color:#D9534F;
  border-radius:5px;
  font-family:'Cinzel',serif;
  font-size:10px;
  letter-spacing:.1em;
  cursor:pointer;
  transition:.3s ease;
}

.cookie-buttons button:hover{
  background:#D9534F;
  color:#000;
}

#cookie-accept{
  background:#D9534F;
  color:#000;
}

#cookie-accept:hover{
  background:#fff;
  border-color:#fff;
}

/* NASCOSTO */

#cookie-banner.hidden{
  opacity:0;
  transform:translateY(30px);
  pointer-events:none;
}
@media(max-width:600px){

  #cookie-banner{
    right:15px;
    bottom:15px;
    width:calc(100vw - 30px);
    max-width:none;
    padding:17px;
  }

  .cookie-icon{
    font-size:25px;
  }

  .cookie-text{
    font-size:14px;
  }

  .cookie-buttons{
    margin-top:12px;
  }

  .cookie-buttons button{
    flex:1;
  }

}

/* =========================
   RIDUZIONE ANIMAZIONI
========================= */
.cookie-text a{
    color:#fff;
    text-decoration:underline;
}

.cookie-text a:visited{
    color:#fff;
}

.cookie-text a:hover{
    color:#fff;
}
@media(prefers-reduced-motion:reduce){

  *{
    animation-duration:.01ms !important;
    transition-duration:.01ms !important;
  }

}




</style>
